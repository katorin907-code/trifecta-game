<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>価値観3連単 ONLINE</title><style>*{box-sizing:border-box}body{margin:0;background:#141321;color:#f5efff;font:16px system-ui}main{max-width:520px;margin:auto;padding:24px 18px}h1{font-size:36px;line-height:1.1}h2{font-size:24px}small,p{color:#bfb5d6}button,input,select{font:inherit;border-radius:12px;padding:14px;width:100%;margin:6px 0;border:1px solid #49405e}button{background:#c0a3ff;color:#211631;font-weight:800;cursor:pointer}button:disabled{opacity:.4}input,select{background:#242036;color:white}.panel{background:#242036;border-radius:18px;padding:16px;margin:14px 0}.opt{background:#2b263d;color:white;text-align:left}.sel{background:#c0a3ff;color:#211631}.tag{color:#c0a3ff;font-size:12px;letter-spacing:2px}.line{padding:12px 0;border-bottom:1px solid #49405e}.err{color:#ffaaaa}.secondary{background:#30283f;color:white}</style><main><div class="tag">MIDNIGHT / ONLINE</div><div id="app"></div><p id="err" class="err"></p></main><script>
const app=document.querySelector('#app'),err=document.querySelector('#err');let token=sessionStorage.getItem('token'),code=sessionStorage.getItem('code'),s=null,ranks=[],key='',busy=false;const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=x=>document.getElementById(x);async function api(action,extra={}){let res=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,code,...extra})});let v=await res.json();if(v.error)throw Error(v.error);return v}async function act(action,extra={}){if(busy)return;busy=true;try{err.textContent='';let v=await api(action,extra);if(v.token){token=v.token;code=v.code;sessionStorage.setItem('token',token);sessionStorage.setItem('code',code);v=await api('state')}update(v)}catch(e){err.textContent=e.message}finally{busy=false}}function home(){app.innerHTML='<h1>価値観<br>3連単。</h1><p>友達の本音を当てろ。</p><input id="name" placeholder="ニックネーム" maxlength="20"><button id="create">ルームを作る</button><div class="panel"><input id="code" placeholder="参加コード" value="'+esc(new URLSearchParams(location.search).get('room')||'')+'"><button id="join">ルームに参加</button></div>';$('create').onclick=()=>act('create',{name:$('name').value});$('join').onclick=()=>act('join',{name:$('name').value,code:$('code').value.trim()})}function update(v){let k=[v.round,v.q,v.phase].join('|');if(k!==key){ranks=[];key=k}if(JSON.stringify(s)===JSON.stringify(v))return;s=v;render()}function render(){let h='<p>ROOM '+esc(s.code)+'　|　'+esc(s.players[s.me].name)+'</p>';let board=()=>[...s.players].sort((a,b)=>b.score-a.score).map(x=>'<div class="line">'+esc(x.name)+'　<strong>'+x.score+' pt</strong></div>').join('');if(s.phase==='lobby'){h+='<h1>参加待ち</h1><div class="panel"><h2>'+esc(s.code)+'</h2><button id="share">参加URLを共有</button></div><h2>'+s.players.length+'人参加中</h2>'+s.players.map(x=>'<div class="line">'+esc(x.name)+'</div>').join('');if(s.host)h+='<select id="mode">'+['全部','恋愛','価値観','深夜','究極の選択','メンバー'].map(x=>'<option>'+x+'</option>').join('')+'</select><select id="cycles"><option value="1">1周</option><option value="2">2周</option></select><button id="start" '+(s.players.length<3?'disabled':'')+'>スタート</button>';else h+='<p>ホストの開始を待っています</p>'}else if(s.phase==='play'){h+='<div class="tag">ROUND '+(s.round+1)+' / '+s.total+'　'+esc(s.cat)+'</div><h2>'+esc(s.q)+'</h2><p>'+ (s.me===s.judge?'あなたの本音を選択':esc(s.players[s.judge].name)+'の本音を予想')+'</p><p>回答済み '+s.done+' / '+s.players.length+'</p>';if(s.submitted)h+='<div class="panel">🔒 回答完了！ 全員の回答を待っています。</div>';else h+=s.choices.map((x,i)=>'<button class="opt '+(ranks.includes(i)?'sel':'')+'" data-i="'+i+'">'+(ranks.includes(i)?(ranks.indexOf(i)+1)+'位':'○')+'　'+esc(x)+'</button>').join('')+'<button id="submit" '+(ranks.length!==3?'disabled':'')+'>回答を確定</button>';if(s.host)h+='<button class="secondary" id="skip">お題を変更（全員の回答をリセット）</button>'}else if(s.phase==='result'){let ans=s.results[s.judge];h+='<h2>正解発表 🎯</h2><p>'+esc(s.q)+'</p><div class="panel">'+ans.map((x,i)=>'<div class="line">'+(i+1)+'位　'+esc(s.choices[x])+'</div>').join('')+'</div>'+s.players.map((x,i)=>i===s.judge?'':'<div class="line">'+esc(x.name)+'　+'+x.gain+'pt<br><small>'+s.results[i].map(j=>esc(s.choices[j])).join(' → ')+'</small></div>').join('')+'<h2>現在の順位</h2>'+board();if(s.host)h+='<button id="next">次へ</button>'}else h+='<h1>🏆 最終結果</h1>'+board()+'<button id="leave">ホームに戻る</button>';let mode=$('mode')?.value,cycles=$('cycles')?.value;app.innerHTML=h;if(mode&&$('mode'))$('mode').value=mode;if(cycles&&$('cycles'))$('cycles').value=cycles;app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(ranks.includes(i))ranks=ranks.filter(x=>x!==i);else if(ranks.length<3)ranks.push(i);render()});if($('share'))$('share').onclick=async()=>{let url=location.origin+'/?room='+s.code;try{if(navigator.share)await navigator.share({title:'価値観3連単',url});else if(navigator.clipboard)await navigator.clipboard.writeText(url);else prompt('参加URL',url)}catch(e){prompt('参加URL',url)}};if($('start'))$('start').onclick=()=>act('start',{mode:$('mode').value,cycles:+$('cycles').value});if($('submit'))$('submit').onclick=()=>act('submit',{ranks});if($('next'))$('next').onclick=()=>act('next');if($('skip'))$('skip').onclick=()=>{if(confirm('全員の回答をリセットしますか？'))act('skip')};if($('leave'))$('leave').onclick=()=>{sessionStorage.clear();token=code=s=null;home()}}
home();if(token&&code)act('state');setInterval(()=>{if(token&&code&&!busy)act('state')},1000);
</script></html>
